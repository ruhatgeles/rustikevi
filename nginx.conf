server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets - cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images - cache 1 week
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1w;
        add_header Cache-Control "public";
    }
}
