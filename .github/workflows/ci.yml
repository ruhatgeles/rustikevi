name: CI

on:
  push:
    branches: [main, developer, alternatif]
  pull_request:
    branches: [main, developer]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: test-secret-for-ci-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      # pnpm sürümü package.json "packageManager" alanından okunur
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check (site)
        run: pnpm type-check

      - name: Type-check (api, admin)
        run: pnpm -r type-check

      - name: Unit tests (api)
        run: pnpm --filter @rustikevi/api test

      - name: Unit tests (admin)
        run: pnpm --filter @rustikevi/admin test

      - name: Build (api, admin, site)
        run: |
          pnpm --filter @rustikevi/api build
          pnpm --filter @rustikevi/admin build
          pnpm build

  integration:
    name: API integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: check
    env:
      JWT_SECRET: test-secret-for-ci-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Integration tests
        run: pnpm --filter @rustikevi/api test:integration

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api
        run: docker build -f packages/api/Dockerfile -t rustikevi-api .
      - name: Build admin
        run: docker build -f packages/admin/Dockerfile -t rustikevi-admin .
      - name: Build web
        run: docker build -f Dockerfile -t rustikevi-web .
