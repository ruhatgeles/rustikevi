server {
    listen 3002;
    server_name _;
    server_tokens off;

    client_max_body_size 25M;

    # Gerçek istemci IP'si: host reverse proxy'si (Caddy/cloudflared) yayınlanan porta
    # loopback/Docker gateway adresinden gelir; yalnızca bu özel ağlardan gelen
    # X-Forwarded-For'a güvenilir. Port doğrudan genel bir adresten çağrılırsa başlık yok sayılır.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    set_real_ip_from fe80::/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker'ın gömülü DNS'i: api konteyneri yeniden oluşturulup IP'si değişse de
    # adres 10 sn'de bir yeniden çözülür (proxy_pass değişkenle verildiği için)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream http://api:3001;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Admin paneli arama motorlarında görünmesin
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # API proxy — Docker ağında api servisine
    location /api/ {
        # URI'siz değişkenli proxy_pass: istek yolu (/api/...) ve query string olduğu gibi iletilir
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # İstemcinin gönderdiği değerleri ezer ($remote_addr yukarıdaki realip ile çözülmüş
        # gerçek istemci IP'sidir); API TRUST_PROXY=true ile bunlara güvenir
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        expires 30d;
    }

    # Hash'li build dosyaları sonsuza kadar önbelleklenebilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # index.html hiç önbelleklenmesin ki yeni sürüm hemen gelsin
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
