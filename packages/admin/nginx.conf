server {
    listen 3002;
    server_name _;
    server_tokens off;

    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Admin paneli arama motorlarında görünmesin
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # API proxy — Docker ağında api servisine
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # İstemcinin gönderdiği değerleri ezer; API TRUST_PROXY=true ile bunlara güvenir
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://api:3001/uploads/;
        proxy_set_header Host $host;
        expires 30d;
    }

    # Hash'li build dosyaları sonsuza kadar önbelleklenebilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # index.html hiç önbelleklenmesin ki yeni sürüm hemen gelsin
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
